name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: pnpm smoke

      # Headless Chrome over the built site. Uses the Google Chrome that the
      # GitHub-hosted Ubuntu images preinstall at /usr/bin/google-chrome
      # (listed in both the 24.04 and 26.04 image manifests); the first command
      # fails fast with a clear message if a future image drops it.
      - name: Browser check (headless Chrome)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          "$CHROME_PATH" --version
          pnpm browser

      - name: Upload browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: .artifacts/screenshots
          if-no-files-found: ignore
          include-hidden-files: true # the path lives under the dot-directory .artifacts/
          retention-days: 7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
